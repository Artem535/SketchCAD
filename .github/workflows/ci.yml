name: CI
on: [push, pull_request]
env:
  # Ubuntu 24.04 apt ships Qt 6.4, below the project minimum (6.5). Use the latest
  # Qt LTS from the official installer instead; qtdeclarative (Qml/Quick) is part of
  # the base desktop kit, so no extra modules are needed.
  SKETCHCAD_QT_VERSION: "6.12.0"
jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1 libxkbcommon-dev libfontconfig1
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.SKETCHCAD_QT_VERSION }}
          cache: true
      - name: Get pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout 1600ce2ba1b6b621bfc5a31a785c4963b817a1c7
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build/desktop -j 2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ctest --test-dir build/desktop --output-on-failure
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs
