.sheet text{font-family:"GOST type B","ISOCPEUR","Arial Narrow",sans-serif;font-style:italic;fill:#111}.k{stroke:#111;stroke-width:.5;fill:none}.t{stroke:#111;stroke-width:.25;fill:none}.hd{stroke:#111;stroke-width:.25;stroke-dasharray:2.5 1.2;fill:none}.cl{stroke:#111;stroke-width:.2;stroke-dasharray:8 1.5 1 1.5;fill:none}
.vh{fill:transparent;stroke:none;cursor:pointer}.vh.sel{stroke:#1668c0;stroke-width:.6;stroke-dasharray:3 2;fill:#1668c00d}
.dm{cursor:pointer}.dm .hr{fill:transparent}.dm.sel line,.dm.sel path{stroke:#1668c0}.dm.sel text{fill:#1668c0}.dm.sel .ar{fill:#1668c0}

<script>
const MODES={sketch:'sketchcad-tablet.html',part:'sketchcad-tablet-3d.html',assembly:'sketchcad-tablet-assembly.html',drawing:'sketchcad-tablet-drawing.html'};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(b.getAttribute('aria-selected')!=='true')location.href=MODES[b.dataset.mode]});
const $=id=>document.getElementById(id);
const IC={sel:'<path d="m6 3 12 9-6 1-3 7Z"/>',view:'<rect x="3" y="4" width="8" height="7"/><rect x="3" y="14" width="8" height="6"/><rect x="14" y="4" width="7" height="7"/>',sec:'<path d="M3 12h18" stroke-dasharray="4 2"/><path d="M5 12V7M19 12V7M3 9l2-2 2 2M17 9l2-2 2 2"/>',det:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',dim:'<path d="M4 8v8M20 8v8M4 12h16m-12-3-3 3 3 3m8-6 3 3-3 3"/>',rough:'<path d="m3 12 3 6 6-14h9"/>',text:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',table:'<rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M3 15h18M10 4v16"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',check:'<path d="m5 12 5 5 9-10"/>',warn:'<path d="M12 3 2 20h20Z M12 10v5M12 18v.5"/>',move:'<path d="M12 2v20M2 12h20m-13-7 3-3 3 3m-6 14 3 3 3-3M5 9l-3 3 3 3m14-6 3 3-3 3"/>',hid:'<path d="M3 12h3M9 12h3M15 12h3M21 12h0"/>',del:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',scale:'<path d="M4 20 20 4M14 4h6v6M4 14v6h6"/>',sheet:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M12 15h8M12 18h8M12 15v6"/>',link:'<path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/>',req:'<path d="M5 6h14M5 10h14M5 14h9M5 18h11"/>'};
const svg=k=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3000)}
const W=80,H=50,D6=6,OFF=10,R=3;
const S={T:8,modelT:8,section:false,hid:{front:true,top:true,left:true},tol:{w:'',t:'',h:'',hs:'',vs:'',d:'',r:''},sel:null,drawer:true,tab:'tree',name:'Пластина крепёжная',code:'СК-002',mat:'Алюминий 6061',std:'ЕСКД',ox:0,oy:0,s:1,k:1};
let hist=[],hi=-1;function snap(){return JSON.stringify({T:S.T,section:S.section,hid:S.hid,tol:S.tol,name:S.name,code:S.code})}
function push(){hist=hist.slice(0,hi+1);hist.push(snap());hi=hist.length-1;btns()}
function btns(){$('undo').disabled=hi<=0;$('redo').disabled=hi>=hist.length-1;$('undo').style.opacity=hi<=0?.38:1;$('redo').style.opacity=hi>=hist.length-1?.38:1}
$('undo').onclick=()=>{if(hi>0){hi--;Object.assign(S,JSON.parse(hist[hi]));render()}};$('redo').onclick=()=>{if(hi<hist.length-1){hi++;Object.assign(S,JSON.parse(hist[hi]));render()}};
/* ---------- drawing generators (sheet units = mm, 1:1) ---------- */
const fx=100,fy=62,lx=215;
const f=n=>String(n).replace('.',',');
function dimH(id,x1,x2,y,yFrom,txt){const s=Math.sign(y-yFrom)||-1,sel=S.sel==='d:'+id;return`<g class="dm${sel?' sel':''}" data-sel="d:${id}"><rect class="hr" x="${Math.min(x1,x2)-2}" y="${y-6}" width="${Math.abs(x2-x1)+4}" height="8"/><line class="t" x1="${x1}" y1="${yFrom+s}" x2="${x1}" y2="${y+s*2}"/><line class="t" x1="${x2}" y1="${yFrom+s}" x2="${x2}" y2="${y+s*2}"/><line class="t" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" marker-start="url(#${sel?'arS':'ar'})" marker-end="url(#${sel?'arS':'ar'})"/><text x="${(x1+x2)/2}" y="${y-1}" font-size="3.5" text-anchor="middle">${txt}</text></g>`}
function dimV(id,y1,y2,x,xFrom,txt,ext=true){const s=Math.sign(x-xFrom)||-1,sel=S.sel==='d:'+id;return`<g class="dm${sel?' sel':''}" data-sel="d:${id}"><rect class="hr" x="${x-6}" y="${Math.min(y1,y2)-2}" width="8" height="${Math.abs(y2-y1)+4}"/>${ext?`<line class="t" x1="${xFrom+s}" y1="${y1}" x2="${x+s*2}" y2="${y1}"/><line class="t" x1="${xFrom+s}" y1="${y2}" x2="${x+s*2}" y2="${y2}"/>`:''}<line class="t" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" marker-start="url(#${sel?'arS':'ar'})" marker-end="url(#${sel?'arS':'ar'})"/><text x="${x-1}" y="${(y1+y2)/2}" font-size="3.5" text-anchor="middle" transform="rotate(-90 ${x-1} ${(y1+y2)/2})">${txt}</text></g>`}
function leader(id,x0,y0,x1,y1,txt,dir=1){const sel=S.sel==='d:'+id,len=txt.length*1.95+2,x2=x1+dir*len;return`<g class="dm${sel?' sel':''}" data-sel="d:${id}"><rect class="hr" x="${Math.min(x1,x2)-1}" y="${y1-6}" width="${len+2}" height="8"/><line class="t" x1="${x1}" y1="${y1}" x2="${x0}" y2="${y0}" marker-end="url(#${sel?'arS':'ar'})"/><line class="t" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y1}"/><text x="${(x1+x2)/2}" y="${y1-1}" font-size="3.5" text-anchor="middle">${txt}</text></g>`}
function vhit(id,x,y,w,h){return`<rect class="vh${S.sel==='v:'+id?' sel':''}" data-sel="v:${id}" x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5"/>`}
function outline(cx,cy){const p=[],x=W/2,y=H/2,arc=(ax,ay,a0)=>{for(let i=0;i<=6;i++){const a=a0+i*Math.PI/12;p.push([ax+R*Math.cos(a),ay+R*Math.sin(a)])}};arc(x-R,-y+R,-Math.PI/2);arc(x-R,y-R,0);arc(-x+R,y-R,Math.PI/2);arc(-x+R,-y+R,Math.PI);return p.map(([a,b])=>[cx+a,cy+b])}
const holes=()=>[[-30,-15],[30,-15],[30,15],[-30,15]];
function frontView(){const T=S.T,x0=fx-W/2,x1=fx+W/2;let s='';
 if(S.section){const segs=[[x0,fx-33],[fx-27,fx+27],[fx+33,x1]];s+=segs.map(([a,b])=>`<rect x="${a}" y="${fy}" width="${b-a}" height="${T}" fill="url(#hatch)"/>`).join('')+`<path class="k" d="M${x0} ${fy}H${fx-33}M${fx-27} ${fy}H${fx+27}M${fx+33} ${fy}H${x1}V${fy+T}H${fx+33}M${fx+27} ${fy+T}H${fx-27}M${fx-33} ${fy+T}H${x0}Z M${fx-33} ${fy}V${fy+T}M${fx-27} ${fy}V${fy+T}M${fx+27} ${fy}V${fy+T}M${fx+33} ${fy}V${fy+T}"/>`+`<text x="${fx}" y="${fy-17}" font-size="5" text-anchor="middle">А–А</text>`}
 else{s+=`<rect class="k" x="${x0}" y="${fy}" width="${W}" height="${T}"/>`;if(S.hid.front)s+=[-33,-27,27,33].map(d=>`<line class="hd" x1="${fx+d}" y1="${fy}" x2="${fx+d}" y2="${fy+T}"/>`).join('')}
 s+=[-30,30].map(d=>`<line class="cl" x1="${fx+d}" y1="${fy-2}" x2="${fx+d}" y2="${fy+T+2}"/>`).join('');
 s+=dimH('w',x0,x1,fy-9,fy,'80'+S.tol.w)+dimV('t',fy,fy+T,x0-9,x0,f(T)+S.tol.t);return s+vhit('front',x0-14,fy-(S.section?22:14),W+20,T+18+(S.section?8:0))}
function topView(){const T=S.T,ty0=fy+T+32,tc=ty0+H/2,x0=fx-W/2,x1=fx+W/2;let s=`<path class="k" d="M${outline(fx,tc).map(p=>p.join(' ')).join('L')}Z"/>`;
 s+=holes().map(([dx,dy])=>{const cx=fx+dx,cy=tc+dy;return`<circle class="k" cx="${cx}" cy="${cy}" r="${D6/2}"/><path class="cl" d="M${cx-5} ${cy}h10M${cx} ${cy-5}v10"/>`}).join('');
