const tools=[['sel','sel'],['line','line'],['rect','rect'],['circle','circle'],['arc','arc'],['pt','pt'],'-',['cons','cons'],['trim','trim'],['dim','dim'],'-',['con','con']];
function buildRail(){$('rail').innerHTML=tools.map(x=>x==='-'?'<div class="rsep"></div>':`<button class="tool" data-tool="${x[0]}" aria-pressed="${S.tool===x[0]}">${svgI(x[1])}<span>${t(x[0])}</span></button>`).join('');
 $('rail').querySelectorAll('.tool').forEach(b=>b.onclick=()=>{const k=b.dataset.tool;if(k==='con'){toggleInsp();return}S.tool=k;if(k!=='sel'){select(null)}buildRail();toast(b.textContent.trim()+': '+(S.stylus?(S.lang==='ru'?'рисуйте стилусом':'draw with the stylus'):(S.lang==='ru'?'рисуйте пальцем':'draw with a finger')))})}
function toast(m,err){const e=$('toast');e.textContent=m;e.className='toast show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
/* geometry */
const sc=6,ox=0,oy=0;const P=()=>({x:604-S.v.W*sc/2-(S.insp&&!S.portrait?150:0),y:(S.portrait?330:430)+S.v.H*sc/2});
function draw(){const {W,H,D,off}=S.v,p=P(),w=W*sc,h=H*sc,X=p.x,Y=p.y,r=D/2*sc;const pt=(a,b)=>[X+a*sc,Y-b*sc];
 const sx=S.zoom;const holes=[[off,off],[W-off,off],[off,H-off],[W-off,H-off]];
 const c=(k)=>S.sel===k?' sel':'',bad=S.conflict?' bad':'';
 const [x0,y0]=pt(0,0),[x1,y1]=pt(W,H);
 const dimT=(k,x,y,txt,w2)=>`<g class="dimt${S.edit===k?' edit':''}" data-dim="${k}" tabindex="0" role="button" aria-label="${txt}"><rect class="hitr" x="${x-w2/2-6}" y="${y-30}" width="${w2+12}" height="60"/><rect x="${x-w2/2}" y="${y-18}" width="${w2}" height="36" rx="18"/><text x="${x}" y="${y}">${txt}</text></g>`;
 const buf=(k,v)=>S.edit===k&&S.buf!==''?S.buf:v;
 let g=`<g transform="translate(604 350) scale(${sx}) translate(-604 -350)">
 <path class="cl" d="M${x0-40} ${y0}H${x1+40}M${x0} ${y0+40}V${y1-40}"/>
 <g class="${bad}"><path class="edge${c('bottom')}" d="M${x0} ${y0}H${x1}"/><path class="edge${c('right')}" d="M${x1} ${y0}V${y1}"/><path class="edge${c('top')}" d="M${x1} ${y1}H${x0}"/><path class="edge${S.conflict?'':c('left')}" d="M${x0} ${y1}V${y0}"/></g>
 ${['bottom:M'+x0+' '+y0+'H'+x1,'right:M'+x1+' '+y0+'V'+y1,'top:M'+x1+' '+y1+'H'+x0,'left:M'+x0+' '+y1+'V'+y0].map(s=>{const[k,d]=s.split(':');return`<path class="hit" data-sel="${k}" d="${d}"/>`}).join('')}
 ${holes.map(([a,b],i)=>{const[cx,cy]=pt(a,b);return`<g class="holeg${c('hole')}" data-sel="hole" style="cursor:pointer"><circle class="hole" cx="${cx}" cy="${cy}" r="${r}"/><circle cx="${cx}" cy="${cy}" r="${r+18}" fill="transparent"/><path class="cl" d="M${cx-r-8} ${cy}h${2*r+16}M${cx} ${cy-r-8}v${2*r+16}"/></g>`}).join('')}
 <g class="dim"><path d="M${x0} ${y1-30}V${y1-62}M${x1} ${y1-30}V${y1-62}M${x0} ${y1-50}H${x1}"/></g>${dimT('W',(x0+x1)/2,y1-50,buf('W',W),64)}
 <g class="dim"><path d="M${x1+30} ${y1}H${x1+62}M${x1+30} ${y0}H${x1+62}M${x1+50} ${y0}V${y1}"/></g>${dimT('H',x1+50,(y0+y1)/2,buf('H',H),64)}
 <g class="dim"><path d="M${x0+off*sc} ${y0+30}V${y0+62}M${x0} ${y0+50}H${x0+off*sc}"/></g>${dimT('off',x0+off*sc/2,y0+52,buf('off',off),64)}
 ${(()=>{const[cx,cy]=pt(W-off,H-off);return`<path class="dim" d="M${cx+r*.7} ${cy-r*.7}l40 -34h30" fill="none" stroke="var(--muted)"/>`+dimT('D',cx+110,cy-r*.7-34,'4×Ø'+buf('D',D),96)})()}
 <g class="cbadge"><g transform="translate(${(x0+x1)/2} ${y0+16})"><circle r="11"/><text>—</text></g><g transform="translate(${x1-16} ${(y0+y1)/2})"><circle r="11"/><text>|</text></g></g>
 <g class="handle fixed" data-fix="1"><circle cx="${x0}" cy="${y0}" r="9" class="handle fixed"/></g>
 <circle class="handle" id="hc" cx="${x1}" cy="${y1}" r="11"/><circle cx="${x1}" cy="${y1}" r="30" fill="transparent" id="hcHit" style="cursor:grab"/>
 </g>`;
 $('svg').innerHTML=`<defs><pattern id="gp" width="${sc*10}" height="${sc*10}" patternUnits="userSpaceOnUse" x="${P().x%(sc*10)}" y="${P().y%(sc*10)}"><path d="M${sc*10} 0H0V${sc*10}" fill="none" stroke="var(--grid)"/></pattern></defs><rect width="1208" height="700" fill="url(#gp)" data-bg="1"/>`+g;
 $('svg').querySelectorAll('[data-sel]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();select(e.dataset.sel)});
 $('svg').querySelectorAll('[data-bg]').forEach(e=>e.onclick=()=>select(null));
 $('svg').querySelectorAll('[data-dim]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();openKp(e.dataset.dim)});
 bindHandle();}
function select(k){S.sel=k;if(k){S.edit=null;$('kp').hidden=true}draw();ctxBar();inspR();if(k&&!S.insp&&!S.portrait){}}
function ctxBar(){const c=$('ctx'),k=S.sel;if(!k){c.hidden=true;return}c.hidden=false;
 const b=(ic,l,cls)=>`<button class="chip ${cls||''}" data-a="${ic}">${svgI(ic)}<span>${l}</span></button>`;
 c.innerHTML=(k==='hole'?b('eq',t('eq'))+b('tan',t('tan'))+b('coin',t('coin')):b(k==='left'||k==='right'?'v':'h',k==='left'||k==='right'?t('vert'):t('horiz'))+b('par',t('par'))+b('perp',t('perp'))+b('eq',t('eq')))+'<div class="csep"></div>'+b('fix',t('fix'))+b('cons',t('cmark'))+'<div class="csep"></div>'+b('del',t('delete'),'danger')+b('close','','');
 c.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{const a=x.dataset.a;if(a==='close'){select(null)}else if(a==='del'){toast((S.lang==='ru'?'Удаление — в макете недоступно (выполнится как команда Undo/Redo)':'Delete is not wired in this mockup (it will be an undoable command)'))}else toast(x.textContent.trim()+': '+(S.lang==='ru'?'ограничение добавлено (демо)':'constraint added (demo)'))})}
function row(l,v,k,u){return`<button class="row" data-dim="${k}"><span>${l}</span><span class="v">${v}</span><span class="u">${u||t('unit')}</span></button>`}
function inspR(){const k=S.sel,{W,H,D,off}=S.v;let title,sub,body;
 if(k==='hole'){title=t('hole')+' ×4';sub=t('geo');body=`<h3>${t('geo')}</h3>${row(t('d'),D,'D')}${row(t('off'),off,'off')}`}
 else if(k){title=t('side');sub=t('geo');const len=(k==='top'||k==='bottom')?W:H;body=`<h3>${t('geo')}</h3>${row(t('len'),len,(k==='top'||k==='bottom')?'W':'H')}`}
 else{title=S.lang==='ru'?'Эскиз 01':'Sketch 01';sub=S.lang==='ru'?'Плоскость XY':'XY plane';body=`<h3>${t('geo')}</h3>${row(t('w'),W,'W')}${row(t('h'),H,'H')}${row(t('d'),D,'D')}${row(t('off'),off,'off')}`}
 body+=`<h3>${t('cons_t')}</h3>`+[['h',t('horiz'),'2'],['v',t('vert'),'2'],['eq',t('eq'),'4'],['fix',t('fix'),'1']].map(([i,l,n])=>`<button class="con"><i>${svgI(i,' width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"')}</i>${l}<em>${n}</em></button>`).join('')+(S.conflict?`<button class="con bad"><i>${svgI('warn',' width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"')}</i>${t('conf')}: ${t('vert')}<em>1</em></button>`:'');
 $('insp').innerHTML=`<div class="insp-h"><div><small>${sub}</small><h2>${title}</h2></div><button class="ib" id="ic" aria-label="${t('close')}">${svgI('close')}</button></div><div class="insp-b">${body}</div>`;
 $('ic').onclick=toggleInsp;$('insp').querySelectorAll('[data-dim]').forEach(e=>e.onclick=()=>openKp(e.dataset.dim))}
function toggleInsp(){S.insp=!S.insp;$('insp').classList.toggle('closed',!S.insp);$('tab').hidden=S.insp||S.portrait;$('zoomc').classList.toggle('shift',S.insp);if(!S.insp&&!S.edit){}draw()}
/* keypad */
const lab={W:'w',H:'h',D:'d',off:'off'};
function openKp(k){S.edit=k;S.buf='';$('kp').hidden=false;kp();draw()}
function kp(){const k=S.edit,keys=['7','8','9','⌫','4','5','6','.','1','2','3','C','0','–','±','✓'];
 $('kp').innerHTML=`<div class="kp-d"><small>${t(lab[k])}</small><output>${S.buf!==''?S.buf:S.v[k]}</output><span>${t('unit')}</span></div><div class="kp-g">${keys.map(x=>`<button class="key ${x==='✓'?'ok':''} ${'–C'.includes(x)?'sm':''}" data-k="${x}" aria-label="${x==='✓'?t('ok'):x}">${x}</button>`).join('')}</div>`;
 $('kp').querySelectorAll('.key').forEach(b=>b.onclick=()=>key(b.dataset.k))}
function key(x){if(x==='✓'){commit();return}if(x==='C'){S.buf=''}else if(x==='⌫'){S.buf=S.buf.slice(0,-1)}else if(x==='±'){S.buf=S.buf.startsWith('-')?S.buf.slice(1):'-'+(S.buf||S.v[S.edit])}else if(x==='–'){closeKp();return}else if(x==='.'){if(!S.buf.includes('.'))S.buf+=(S.buf?'':'0')+'.'}else S.buf+=x;kp();draw()}
function closeKp(){S.edit=null;S.buf='';$('kp').hidden=true;draw()}
function valid(v){const n={...S.v,...v};if(!Object.values(n).every(Number.isFinite)||Object.values(n).some(x=>x<=0))return 'invalid';if(n.off*2+n.D>Math.min(n.W,n.H))return 'fit';return null}
function apply(v){const err=valid(v);if(err){flashBad();toast(t('rb')+t(err),true);return false}Object.assign(S.v,v);hist=hist.slice(0,hi+1);hist.push({...S.v});hi=hist.length-1;undoState();return true}
function commit(){const k=S.edit;if(S.buf===''){closeKp();return}const n=Number(S.buf);const ok=apply({[k]:n});closeKp();if(ok){draw();inspR();toast((S.lang==='ru'?'Размер принят, эскиз пересчитан: ':'Dimension applied: ')+S.v[k])}}
function flashBad(){S.conflict=false;const s=$('svg');s.style.outline='4px solid var(--err)';setTimeout(()=>s.style.outline='',450)}
function undoState(){$('undo').disabled=hi===0;$('redo').disabled=hi===hist.length-1}
$('undo').onclick=()=>{if(hi>0){hi--;S.v={...hist[hi]};undoState();draw();inspR()}};$('redo').onclick=()=>{if(hi<hist.length-1){hi++;S.v={...hist[hi]};undoState();draw();inspR()}};
/* drag corner with offset loupe */
function bindHandle(){const h=$('hcHit');if(!h)return;let drag=false;
 h.onpointerdown=e=>{drag=true;h.setPointerCapture(e.pointerId);e.stopPropagation()};
 h.onpointermove=e=>{if(!drag)return;const sv=$('svg'),pt=sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(sv.getScreenCTM().inverse());const p=P(),z=S.zoom;const wx=(q.x-604)/z+604,wy=(q.y-350)/z+350;
  const W=Math.max(2,Math.round((wx-p.x)/sc)),H=Math.max(2,Math.round((p.y-wy)/sc));S.drag={W,H};
  const fr=$('frame').getBoundingClientRect(),k=fr.width/(S.portrait?800:1280),bd=$('body').getBoundingClientRect();
  const l=$('loupe');l.classList.add('show');l.style.left=((e.clientX-bd.left)/k-66-(S.portrait?0:90))+'px';l.style.top=((e.clientY-bd.top)/k-190)+'px';$('loupeT').textContent=W+' × '+H;
  const prev={...S.v};const err=valid({W,H});if(!err){S.v.W=W;S.v.H=H;draw();bindHandle();$('hcHit').setPointerCapture(e.pointerId);$('hcHit').onpointermove=h.onpointermove;}};
 const end=e=>{if(!drag)return;drag=false;$('loupe').classList.remove('show');if(S.drag){const d=S.drag;S.drag=null;const cur={...S.v};S.v={...hist[hi]};if(!apply({W:d.W,H:d.H})){S.v={...hist[hi]}}draw();inspR()}};
 h.onpointerup=end;h.onpointercancel=end}
/* diagnostics */
function statusUi(){const s=$('status'),tt=$('statusT');s.className='status'+(S.conflict?' err':'');if(S.conflict){tt.textContent=t('conf');s.firstElementChild.innerHTML=I.warn}else{tt.textContent='DOF 0 · '+t('dof0');s.firstElementChild.innerHTML=I.check}}
$('status').onclick=()=>{const p=$('pop');if(!p.hidden){p.hidden=true;return}p.hidden=false;p.innerHTML=`<h4>${t('diag')}</h4><p>${t('cnt')}: 9 · ${t('dcnt')}: 4 · DOF 0</p>${S.conflict?`<p style="color:var(--err)">${svgI('warn',' width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px"')} ${t('cdesc')}</p>`:''}<button class="chip" id="showc">${S.conflict?t('hidec'):t('showc')}</button>`;$('showc').onclick=()=>{S.conflict=!S.conflict;p.hidden=true;statusUi();draw();inspR()}};
/* misc */
$('tab').onclick=toggleInsp;$('menu').onclick=()=>toast(S.lang==='ru'?'Проекты, импорт, экспорт DXF, настройки':'Projects, import, DXF export, settings');$('more').onclick=()=>toast(S.lang==='ru'?'Экспорт DXF · Настройки ввода · Справка':'DXF export · Input settings · Help');
$('zin').onclick=()=>{S.zoom=Math.min(2,S.zoom+.2);draw()};$('zout').onclick=()=>{S.zoom=Math.max(.6,S.zoom-.2);draw()};$('zfit').onclick=()=>{S.zoom=1;draw()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeKp();$('pop').hidden=true;select(null)}if(S.edit){if(/\d/.test(e.key))key(e.key);else if(e.key==='.')key('.');else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')commit()}});
function fit(){const st=$('stage').getBoundingClientRect(),w=S.portrait?800:1280,h=S.portrait?1280:800,k=Math.min(st.width/w,st.height/h,1.15)*.97;$('frame').style.transform=`translate(-50%,-50%) scale(${k})`}
function i18n(){document.documentElement.lang=S.lang;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.i18nAria)));
 $('snapT').textContent=t('snap');$('inputT').textContent=t(S.stylus?'in_s':'in_t');buildRail();statusUi();ctxBar();inspR();if(S.edit)kp();draw()}
$('pOrient').onclick=e=>{S.portrait=!S.portrait;$('frame').classList.toggle('portrait',S.portrait);e.target.setAttribute('aria-pressed',S.portrait);e.target.textContent='Ориентация: '+(S.portrait?'портретная':'альбомная');$('tab').hidden=S.insp||S.portrait;$('svg').setAttribute('viewBox',S.portrait?'0 0 800 1000':'0 0 1208 700');$('zoomc').classList.toggle('shift',S.insp);fit();draw()};
$('pTheme').onclick=e=>{S.theme=S.theme==='light'?'dark':'light';document.documentElement.dataset.theme=S.theme;e.target.setAttribute('aria-pressed',S.theme==='dark')};
$('pLang').onclick=e=>{S.lang=S.lang==='ru'?'en':'ru';e.target.textContent=S.lang==='ru'?'EN':'RU';i18n()};
$('pInput').onclick=e=>{S.stylus=!S.stylus;e.target.setAttribute('aria-pressed',!S.stylus);e.target.textContent='Ввод: '+(S.stylus?'стилус':'только касание');i18n()};
$('pReach').onclick=e=>{const on=e.target.getAttribute('aria-pressed')!=='true';e.target.setAttribute('aria-pressed',on);$('reach').classList.toggle('show',on)};
window.onresize=fit;fit();undoState();i18n();
</script></body></html>
