function drawingScene(){return `<svg viewBox="0 0 780 550" aria-label="Чертёж пластины"><rect x="18" y="5" width="744" height="530" fill="white" stroke="#bccbd8"/><rect x="42" y="28" width="696" height="484" fill="none" stroke="#51677b"/><g stroke="#3a5167" stroke-width="1.3" fill="none"><rect x="110" y="94" width="270" height="170" rx="9"/>${[[143,127],[347,127],[143,231],[347,231]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="10"/>`).join('')}<path d="M100 179h291M245 83v192" stroke-dasharray="10 4 2 4"/><path d="M110 76V55M380 76V55M110 63h270M396 94h25M396 264h25M412 94v170"/><rect x="110" y="339" width="270" height="26"/><path d="M143 339v26M347 339v26" stroke-dasharray="5 3"/><path d="M396 339h25M396 365h25M412 339v26"/><path d="m349 124 37-35h64"/></g><g fill="#334d64" font-size="13"><text x="245" y="57" text-anchor="middle">80</text><text x="421" y="183">50</text><text x="400" y="82">4 × Ø6</text><text x="421" y="357">8</text><text x="103" y="289" font-size="11">Вид сверху</text><text x="103" y="389" font-size="11">Вид спереди</text></g><g transform="translate(426 105) scale(.42)">${plate()}</g><g fill="none" stroke="#51677b"><rect x="380" y="428" width="358" height="84"/><path d="M380 452h358M380 485h358M442 428v24M515 428v24M660 428v84M380 499h280"/></g><g fill="#344c61" font-size="11"><text x="391" y="445">Ред. A</text><text x="454" y="445">Лист 1</text><text x="527" y="445">Масштаб 1:1</text><text x="392" y="474" font-size="17">Крепёжная пластина</text><text x="391" y="496">Алюминий 6061</text><text x="392" y="510" font-size="9">SketchCAD</text><text x="670" y="474">A4</text></g></svg>`}
function assemblyScene(){return `<svg viewBox="0 0 700 550" aria-label="Сборка крепления"><g transform="translate(0 70)"><path d="m130 265 300 110 165-145-300-110Z" fill="#82939f" stroke="#536d81"/><path d="m130 265 300 110v26L130 291Z" fill="#637c91" stroke="#536d81"/><path d="m430 375 165-145v26L430 401Z" fill="#4e687f" stroke="#536d81"/></g>${[[231,293],[442,366]].map(([x,y])=>`<path d="M${x-18} ${y-62}v64q18 18 36 0v-64" fill="#d9a663" stroke="#ae8149"/><ellipse cx="${x}" cy="${y-62}" rx="18" ry="10" fill="#efd0a1" stroke="#ae8149"/>`).join('')}<g transform="translate(0 -60)">${plate()}</g>${[[238,190],[455,270],[525,202]].map(([x,y])=>`<path d="M${x-6} ${y}v31q6 8 12 0v-31" fill="#657c91"/><path d="m${x-16} ${y-8} 16-8 16 8v12l-16 8-16-8Z" fill="#8299ae" stroke="#405e7b"/><path d="m${x-16} ${y-8} 16 9 16-9" fill="none" stroke="#bcd0e1"/>`).join('')}<path d="M231 231v94" stroke="#368ce0" stroke-dasharray="6 5"/><circle cx="231" cy="296" r="28" fill="none" stroke="#368ce0" stroke-width="1.5"/><path d="m248 321 36 29h106" stroke="#368ce0" fill="none"/><text x="286" y="344" fill="#2675b8" font-size="13">Соосность 01</text></svg>`}
let current='part',zoom=100;
function notify(text){document.querySelector('#toast').textContent=text;document.querySelector('#toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.querySelector('#toast').classList.remove('show'),2200)}
function render(mode){current=mode;const c=configs[mode];document.querySelectorAll('.mode').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',b.dataset.mode===mode)});document.querySelector('#tools').innerHTML=c.tools.map(([icon,name],i)=>`<button class="tool ${i===0?'selected':''}" title="${name}"><svg viewBox="0 0 24 24">${icons[icon]}</svg>${name}</button>${i===0?'<div class="tool-sep"></div>':''}`).join('');document.querySelector('#tree').innerHTML=c.tree.map(([icon,name,cls])=>`<button class="tree-row ${cls}"><span class="tree-icon">${icon}</span>${name}<span class="eye">${cls.includes('disabled')?'':'◦'}</span></button>`).join('');document.querySelector('#treeFooter').innerHTML=c.foot;document.querySelector('#breadcrumb').innerHTML=c.crumb.split(' / ').map((t,i)=>i===0?t:`<span>›</span><strong>${t}</strong>`).join('');document.querySelector('#pill').textContent=c.pill;document.querySelector('#footerStatus').textContent=c.status;document.querySelector('#hint').textContent=c.hint;document.querySelector('#viewport').className='viewport '+(mode==='sketch'?'sketch':mode==='drawing'?'sheet':'');document.querySelector('#cube').hidden=mode==='sketch'||mode==='drawing';document.querySelector('#scene').innerHTML=mode==='sketch'?sketchScene():mode==='drawing'?drawingScene():mode==='assembly'?assemblyScene():`<svg viewBox="0 0 700 520" aria-label="Параметрическая пластина">${plate()}</svg>`;document.querySelector('#inspector').innerHTML=`<div class="inspector-top"><div class="eyebrow">${c.sub}</div><h2>${c.title}</h2><p>${mode==='part'?'Из Эскиза 01':mode==='sketch'?'Контур и отверстия':mode==='assembly'?'Цилиндрические поверхности':'Ассоциативные виды'}</p></div><div class="section"><h3>${mode==='drawing'?'Параметры листа':mode==='assembly'?'Компоненты и параметры':'Параметры'}</h3>${c.fields.map(([label,value,unit])=>`<div class="field"><label>${label}</label>${unit==='select'?`<select aria-label="${label}"><option>${value}</option></select>`:`<input aria-label="${label}" type="number" value="${value}" min="0.1" step="1" data-field="${label}"><span>${unit}</span>`}</div>`).join('')}</div><div class="section"><h3>Состояние</h3>${c.extra}</div>${mode==='sketch'?'<div class="section"><h3>Ограничения</h3><div class="constraint"><b>↔</b>Горизонтальность<span>2</span></div><div class="constraint"><b>↕</b>Вертикальность<span>2</span></div><div class="constraint"><b>=</b>Равные радиусы<span>4</span></div><div class="constraint"><b>⌑</b>Фиксация начала<span>1</span></div></div>':`<div class="section"><h3>${mode==='drawing'?'Оформление':'Связанные элементы'}</h3><div class="constraint"><b>▱</b>${mode==='assembly'?'Пластина:1':mode==='drawing'?'Основная надпись':'Эскиз 01'}<span>›</span></div><div class="constraint"><b>↗</b>${mode==='drawing'?'Размеры и допуски':'Зависимости'}<span>›</span></div></div>`}<div class="section"><button class="primary" id="apply">${mode==='sketch'?'Завершить эскиз':'Применить изменения'}</button></div>`;document.querySelector('#apply').onclick=()=>mode==='sketch'?render('part'):notify('Изменения показаны в макете');document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#hint').textContent=b.textContent.trim()+': выберите геометрию'});document.querySelectorAll('.tree-row').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tree-row').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('.inspector-top h2').textContent=b.childNodes[1].textContent.trim()});document.querySelectorAll('.face').forEach(f=>f.onclick=()=>{document.querySelectorAll('.face').forEach(x=>x.classList.remove('selected-face'));f.classList.add('selected-face');document.querySelector('.inspector-top h2').textContent=f.dataset.face;document.querySelector('.eyebrow').textContent='Выбрана поверхность'});document.querySelectorAll('input[data-field]').forEach(f=>f.onchange=()=>{const v=Math.max(.1,Number(f.value)||.1);f.value=v;const name=f.dataset.field==='Ширина'?'width':f.dataset.field==='Высота'?'height':null;if(name)document.querySelectorAll(`[data-dim="${name}"]`).forEach(t=>t.textContent=v);notify('Параметр обновлён в макете')});applyZoom()}
function applyZoom(){document.querySelector('#zoomLabel').textContent=zoom+'%';const svg=document.querySelector('#scene>svg');if(svg)svg.style.transform=`scale(${zoom/100})`}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{zoom=100;render(b.dataset.mode)});document.querySelector('#zoomIn').onclick=()=>{zoom=Math.min(150,zoom+10);applyZoom()};document.querySelector('#zoomOut').onclick=()=>{zoom=Math.max(50,zoom-10);applyZoom()};document.querySelector('#fit').onclick=()=>{zoom=100;applyZoom()};document.querySelector('#grid').onclick=()=>document.querySelector('#viewport').classList.toggle('sketch');document.querySelector('#cube').onclick=()=>{zoom=100;applyZoom();notify('Изометрический вид')};document.querySelector('#save').onclick=()=>notify('Состояние сохранения: макет');document.querySelector('#add').onclick=()=>notify('Добавить: эскиз, деталь, сборку или лист');document.querySelector('#export').onclick=()=>{const formats=current==='drawing'?['PDF','DXF']:current==='sketch'?['DXF']:['STEP','STL','IGES','3MF'];document.querySelector('#format').innerHTML=formats.map(x=>`<option>${x}</option>`).join('');document.querySelector('#exportDialog').showModal()};document.querySelector('#cancelExport').onclick=()=>document.querySelector('#exportDialog').close();document.querySelector('#confirmExport').onclick=()=>{document.querySelector('#exportDialog').close();notify('Предпросмотр экспорта '+document.querySelector('#format').value)};document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName)||document.querySelector('dialog').open)return;const mode=['sketch','part','assembly','drawing'][Number(e.key)-1];if(mode)render(mode)});render('part');
</script></body></html>
